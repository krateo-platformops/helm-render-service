{{- if .Values.snowplowEndpoint.enabled }}
# External Endpoint for helm-render-service. snowplow's RESTAction `endpointRef`
# resolves an Endpoint from a Secret keyed by `server-url` (the only REQUIRED
# field; token/ca/etc. are optional and unset here — the service is
# cluster-internal, plain HTTP, and accepts-and-ignores Authorization headers).
# Consumed by POST api-steps targeting /render and /diff.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.snowplowEndpoint.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "krateo.io/verbose": "true"
type: Opaque
stringData:
  server-url: http://{{ include "helm-render-service.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}
{{- end }}
