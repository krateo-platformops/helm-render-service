# Krateo COMPONENT release workflow — helm-render-service variant. Multi-arch
# (linux/amd64,linux/arm64) via QEMU + Buildx, so the published image runs on both
# amd64 clusters and arm64 (e.g. Apple-silicon kind/dev). The bare-semver tag
# pattern is the house convention shared with release-oci.yaml, so ONE tag push
# publishes both the container image (here) and the OCI helm chart (release-oci).
name: release-image

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

env:
  GHCR_REPO: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build & push image (multi-platform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_REPO }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.GHCR_REPO }}:${{ steps.meta.outputs.version }}
